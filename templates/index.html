<!DOCTYPE html>
<html>
<head>
    <title>Real-time Translation Video Call</title>
    <style>
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .video-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 20px;
        }
        .video-box { 
            position: relative; 
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video { 
            width: 100%; 
            height: 300px; 
            object-fit: cover;
        }
        .subtitle { 
            position: absolute; 
            bottom: 10px; 
            left: 0; 
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            z-index: 2;
        }
        .controls { 
            margin-top: 20px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button { 
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #007bff;
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        select { 
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            background: white;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f5f5;
            padding: 10px 20px;
            border-radius: 25px;
            margin-top: 10px;
        }
        .volume-control label {
            font-size: 14px;
            color: #333;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 150px;
            height: 5px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #007bff;
            border-radius: 50%;
            cursor: pointer;
        }
        .status-indicators {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        .indicator {
            display: none;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            color: white;
        }
        #loadingIndicator {
            background: #ffa500;
        }
        #audioPlayingIndicator {
            background: #28a745;
        }
        .language-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .language-selector label {
            margin-right: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px;">Real-time Translation Video Call</h1>
        
        <div class="language-selector">
            <label for="targetLanguage">Translation Language:</label>
            <select id="targetLanguage">
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="ru">Russian</option>
            </select>
        </div>

        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="subtitle" id="localSubtitle">Your speech will appear here</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="subtitle" id="remoteSubtitle">Translation will appear here</div>
            </div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button id="startButton" onclick="startCall()">Start Call</button>
                <button id="toggleMic" onclick="toggleMicrophone()" disabled>Start Speaking</button>
                <button id="endButton" onclick="endCall()" disabled>End Call</button>
            </div>

            <div class="volume-control">
                <label for="volume">Translation Volume:</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1" disabled>
                <span id="volumeValue">100%</span>
            </div>

            <div class="status-indicators">
                <div id="loadingIndicator" class="indicator">Loading Translation...</div>
                <div id="audioPlayingIndicator" class="indicator">Playing Translation</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <script>
        // Update volume display
        document.getElementById('volume').addEventListener('input', function(e) {
            document.getElementById('volumeValue').textContent = 
                Math.round(e.target.value * 100) + '%';
        });
    </script>
</body>
</html>
